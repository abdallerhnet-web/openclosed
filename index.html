<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
<title>OpenClose — Web3 Outreach Pipeline</title>

<style>
:root{--bg:#05050f;--sf:#0c0c1e;--sf2:#13132a;--bd:rgba(255,255,255,0.07);--ac:#00ffc8;--ac2:#7B5EA7;--tx:#e8e8f0;--mu:#4a4a6a;--dn:#ff4455;--wn:#f0c040;}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;max-width:480px;margin:0 auto;min-height:100vh;overflow-x:hidden;}
/* HEADER */
.hdr{background:linear-gradient(180deg,#0c0c1e,#08081a);border-bottom:1px solid var(--bd);padding:15px 16px 12px;position:sticky;top:0;z-index:100;backdrop-filter:blur(10px);}
.hdr-in{display:flex;justify-content:space-between;align-items:center;}
.logo{font-size:19px;font-weight:800;letter-spacing:-.5px;}.logo span{color:var(--ac);}
.sdot{font-family:'Courier New',Courier,monospace;font-size:9px;letter-spacing:2px;color:var(--ac);margin-bottom:2px;}
.stats{display:flex;gap:14px;}.stat{text-align:center;}
.sv{font-size:15px;font-weight:700;}.sl{font-size:9px;color:var(--mu);font-family:'Courier New',Courier,monospace;letter-spacing:1px;}
/* TABS */
.tabs{display:flex;background:var(--sf);border-bottom:1px solid var(--bd);position:sticky;top:66px;z-index:99;overflow-x:auto;scrollbar-width:none;}
.tabs::-webkit-scrollbar{display:none;}
.tab{flex:1;min-width:56px;padding:11px 2px;background:none;border:none;border-bottom:2px solid transparent;color:var(--mu);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:9px;font-weight:700;cursor:pointer;transition:all .2s;white-space:nowrap;}
.tab.on{color:var(--ac);border-bottom-color:var(--ac);}
/* CONTENT */
.page{padding:0 0 80px;}
.sec{padding:16px;}
/* CARDS */
.card{background:var(--sf);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:10px;cursor:pointer;transition:border-color .2s,transform .1s;}
.card:active{transform:scale(.99);}
.card:hover{border-color:rgba(0,255,200,.2);}
/* PILLS */
.pills{display:flex;gap:8px;overflow-x:auto;padding:10px 16px 4px;scrollbar-width:none;}
.pills::-webkit-scrollbar{display:none;}
.pill{padding:5px 13px;border-radius:20px;border:1px solid var(--bd);background:transparent;color:var(--mu);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:10px;font-weight:600;cursor:pointer;white-space:nowrap;transition:all .2s;}
.pill.on{border-color:var(--ac);background:rgba(0,255,200,.08);color:var(--ac);}
/* BADGE */
.bdg{padding:3px 10px;border-radius:20px;font-size:10px;font-weight:700;font-family:'Courier New',Courier,monospace;white-space:nowrap;}
/* FORM */
.f{margin-bottom:14px;}
.f label{display:block;font-size:10px;color:var(--ac);letter-spacing:2px;text-transform:uppercase;font-family:'Courier New',Courier,monospace;margin-bottom:6px;}
.f input,.f textarea{width:100%;background:var(--sf2);border:1px solid var(--bd);border-radius:10px;padding:11px 14px;color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:13px;outline:none;transition:border-color .2s;resize:none;}
.f input:focus,.f textarea:focus{border-color:rgba(0,255,200,.4);}
/* BUTTONS */
.bp{width:100%;padding:14px;border-radius:12px;border:none;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#000;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-weight:800;font-size:14px;cursor:pointer;}
.bp:disabled{opacity:.3;cursor:not-allowed;}
.bd-{width:100%;padding:12px;border-radius:12px;border:1px solid rgba(255,68,85,.3);background:rgba(255,68,85,.08);color:var(--dn);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:13px;cursor:pointer;}
/* CHIPS */
.chips{display:flex;gap:8px;flex-wrap:wrap;}
.chip{padding:6px 14px;border-radius:20px;border:1px solid var(--bd);background:transparent;color:var(--mu);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:11px;cursor:pointer;transition:all .2s;}
.chip.on{border-color:var(--ac);background:rgba(0,255,200,.08);color:var(--ac);}
/* TAG */
.tag{font-size:10px;color:var(--mu);background:rgba(255,255,255,.04);padding:2px 9px;border-radius:10px;font-family:'Courier New',Courier,monospace;}
/* BANNER */
.bnr{margin:0 16px 12px;background:rgba(240,192,64,.06);border:1px solid rgba(240,192,64,.2);border-radius:12px;padding:12px 14px;cursor:pointer;}
.bnr-t{font-size:12px;color:var(--wn);font-weight:700;margin-bottom:2px;}
.bnr-s{font-size:11px;color:var(--mu);}
/* SOURCE */
.sc{background:var(--sf);border:1px solid var(--bd);border-radius:14px;margin-bottom:10px;overflow:hidden;}
.sc-h{padding:14px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;}
.sc-b{padding:0 14px 14px;border-top:1px solid var(--bd);}
.sc-tag{font-size:10px;background:rgba(0,255,200,.08);color:var(--ac);padding:2px 9px;border-radius:10px;font-family:'Courier New',Courier,monospace;}
.ol{display:block;text-align:center;padding:11px;border-radius:10px;background:rgba(0,255,200,.06);border:1px solid rgba(0,255,200,.25);color:var(--ac);text-decoration:none;font-weight:700;font-size:13px;margin-top:10px;}
/* LOCK */
.ls{text-align:center;padding:50px 20px;}
.li{font-size:40px;margin-bottom:12px;}
.lt{font-size:18px;font-weight:800;margin-bottom:6px;}
.lb{font-size:13px;color:var(--mu);margin-bottom:24px;line-height:1.7;}
/* PRICING */
.pr{display:flex;gap:12px;margin:20px 0;}
.pc{flex:1;background:var(--sf);border:1px solid var(--bd);border-radius:14px;padding:16px;text-align:center;cursor:pointer;transition:all .2s;}
.pc.on{border-color:var(--ac);background:rgba(0,255,200,.05);}
.pc .pl{font-size:10px;color:var(--mu);font-family:'Courier New',Courier,monospace;letter-spacing:1px;margin-bottom:6px;}
.pc .pa{font-size:22px;font-weight:800;color:var(--ac);}
.pc .pp{font-size:11px;color:var(--mu);}
.pc .ps{font-size:10px;color:var(--ac);margin-top:4px;font-weight:700;}
/* FEATURES */
.fi{display:flex;gap:12px;align-items:flex-start;margin-bottom:14px;}
.fi-ic{font-size:18px;flex-shrink:0;margin-top:1px;}
.fi-t{font-size:13px;font-weight:700;}
.fi-d{font-size:11px;color:var(--mu);margin-top:2px;line-height:1.6;}
/* UNLOCK BOX */
.ub{background:var(--sf);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-top:16px;}
.uh{font-size:12px;color:var(--mu);margin-bottom:10px;line-height:1.7;}
.em{font-size:11px;color:var(--dn);margin-bottom:8px;font-family:'Courier New',Courier,monospace;}
/* TOAST */
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:var(--sf2);border:1px solid rgba(0,255,200,.3);border-radius:20px;padding:10px 20px;color:var(--ac);font-size:12px;font-family:'Courier New',Courier,monospace;z-index:999;box-shadow:0 8px 32px rgba(0,0,0,.5);animation:fi .2s ease;pointer-events:none;white-space:nowrap;}
@keyframes fi{from{opacity:0;transform:translateX(-50%) translateY(-8px);}to{opacity:1;transform:translateX(-50%) translateY(0);}}
/* NAV */
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:rgba(8,8,26,.96);border-top:1px solid var(--bd);display:flex;z-index:100;backdrop-filter:blur(16px);}
.nb{flex:1;padding:10px 0 8px;background:none;border:none;color:var(--mu);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:8px;font-weight:600;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;transition:color .2s;}
.nb.on{color:var(--ac);}
.ni{font-size:15px;}
/* EMPTY */
.empty{text-align:center;padding:60px 20px;color:var(--mu);}
/* SECTION TITLE */
.st{font-size:15px;font-weight:800;margin-bottom:4px;}
.ss{font-size:11px;color:var(--mu);font-family:'Courier New',Courier,monospace;margin-bottom:16px;}
/* PROMPTS */
.pcat{font-size:10px;color:var(--ac2);font-family:'Courier New',Courier,monospace;letter-spacing:2px;font-weight:700;margin:20px 0 10px;text-transform:uppercase;}
.pcard{background:var(--sf);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:10px;}
.plb{font-size:12px;font-weight:700;color:var(--ac);margin-bottom:3px;}
.psb{font-size:10px;color:var(--mu);font-family:'Courier New',Courier,monospace;margin-bottom:10px;}
.ptxt{font-size:11px;color:#999;line-height:1.8;font-family:'Courier New',Courier,monospace;margin-bottom:12px;padding:10px;background:rgba(255,255,255,.03);border-radius:8px;border-left:2px solid var(--ac2);}
.cpb{padding:7px 16px;border-radius:8px;border:1px solid rgba(0,255,200,.25);background:transparent;color:var(--ac);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:11px;font-weight:700;cursor:pointer;transition:all .2s;}
.cpb.ok{background:rgba(0,255,200,.1);}
/* STRATEGIST */
.stc{background:var(--sf);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:12px;}
.stm{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px;}
.stt{font-size:15px;font-weight:800;margin-bottom:2px;}
.sta{font-size:11px;color:var(--ac);font-family:'Courier New',Courier,monospace;}
.stp{font-size:16px;font-weight:800;color:var(--ac);}
.std{font-size:10px;color:var(--mu);text-align:right;margin-top:2px;}
.stct{font-size:10px;background:rgba(123,94,167,.15);color:var(--ac2);padding:2px 9px;border-radius:10px;font-family:'Courier New',Courier,monospace;display:inline-block;margin-bottom:10px;}
.ste{font-size:12px;color:#888;line-height:1.7;margin-bottom:12px;}
.stcont{background:rgba(0,255,200,.04);border:1px solid rgba(0,255,200,.15);border-radius:10px;padding:12px;font-size:12px;color:#ccc;line-height:1.8;font-family:'Courier New',Courier,monospace;margin-bottom:10px;}
.sub{width:100%;padding:11px;border-radius:10px;border:1px solid rgba(123,94,167,.4);background:rgba(123,94,167,.1);color:var(--ac2);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:12px;font-weight:700;cursor:pointer;}
.ulb{display:inline-flex;align-items:center;gap:6px;font-size:11px;color:var(--ac);font-family:'Courier New',Courier,monospace;margin-bottom:8px;}
/* MODAL */
.mo{position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:50;display:flex;align-items:flex-end;justify-content:center;}
.mb{background:var(--sf2);border:1px solid var(--bd);border-radius:16px 16px 0 0;padding:20px;width:100%;max-width:480px;}
.mst{background:rgba(123,94,167,.08);border:1px solid rgba(123,94,167,.2);border-radius:10px;padding:12px;margin-bottom:16px;}
.mst p{font-size:12px;color:#888;line-height:2;}
.mr{display:flex;gap:10px;}
.mc{flex:1;padding:12px;border-radius:10px;border:1px solid var(--bd);background:transparent;color:var(--mu);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:12px;cursor:pointer;}
.mok{flex:2;padding:12px;border-radius:10px;border:none;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#000;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-weight:800;font-size:12px;cursor:pointer;}
/* SUBMIT INFO */
.si{background:rgba(0,255,200,.04);border:1px solid rgba(0,255,200,.15);border-radius:12px;padding:14px;margin-bottom:16px;}
.si-t{font-size:11px;color:var(--ac);font-weight:700;font-family:'Courier New',Courier,monospace;margin-bottom:6px;}
.si-b{font-size:11px;color:var(--mu);line-height:1.9;}
input[type=date]::-webkit-calendar-picker-indicator{filter:invert(.5);}
</style>
</head>
<body>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>

<script>
const {useState}=React;
const ADMIN="ABDYWEB3",TG="@anonking1",FREE=5,CUT=25;

// Monthly rotating code generator — OC + MONTH + YR (e.g. OCMAY26)
function validProCode(input){
  const code=input.trim().toUpperCase();
  if(code===ADMIN)return true;
  const now=new Date();
  const M=["JAN","FEB","MAR","APR","MAY","JUN","JUL","AUG","SEP","OCT","NOV","DEC"];
  const yr=String(now.getFullYear()).slice(2);
  const current=`OC${M[now.getMonth()]}${yr}`;
  // previous month grace period
  const prev=new Date(now.getFullYear(),now.getMonth()-1,1);
  const prevCode=`OC${M[prev.getMonth()]}${String(prev.getFullYear()).slice(2)}`;
  return code===current||code===prevCode;
}
const STATUS={"No Reply":{c:"#888",b:"rgba(136,136,136,.1)"},"Replied":{c:"#f0c040",b:"rgba(240,192,64,.1)"},"In Convo":{c:"#40c0f0",b:"rgba(64,192,240,.1)"},"Closed 💰":{c:"#00ffc8",b:"rgba(0,255,200,.1)"},"Dead ❌":{c:"#ff4455",b:"rgba(255,68,85,.1)"}};
const CHAINS=["Solana","Base","BSC","ETH","Other"],PLATS=["X","Telegram","Discord"];

const SOURCES=[
  {name:"Pump.fun",url:"https://pump.fun",chain:"Solana",tag:"🔥 Hottest",tip:"New meme coins every minute. Filter 'Just launched'. 50–500 holders + active dev wallet buying = hot lead."},

  {name:"Birdeye",url:"https://birdeye.so",chain:"Solana",tag:"📊 Data",tip:"Sort trending by volume spike. Cross-check X handle. Under 2K followers = your target."},
  {name:"DEXTools",url:"https://www.dextools.io/app/en/pairs",chain:"Multi-chain",tag:"📈 Pro",tip:"Hot Pairs shows sudden attention. Find the founder on X before the hype cycle dies."},
  {name:"Defined.fi",url:"https://www.defined.fi",chain:"Multi-chain",tag:"🌐 Wide",tip:"Clean multi-chain new pools. Filter by creation date. Great for non-Solana meme projects."},
  {name:"Ave.ai",url:"https://ave.ai",chain:"BSC/ETH",tag:"🐂 BSC",tip:"Best for BSC memes. Trending shows sudden volume. BSC founders close fastest."},
  {name:"PooCoin",url:"https://poocoin.app",chain:"BSC",tag:"💩 BSC",tip:"Founders here are very active. Consistent buys + no big sells = hot entry point."},
  {name:"CoinGecko New",url:"https://www.coingecko.com/en/new-cryptocurrencies",chain:"Multi-chain",tag:"🦎 Listed",tip:"Newly listed = just hit a milestone. In hustle mode. Highly receptive to marketing help."},
  {name:"X Live Search",url:"https://x.com/search?q=%22presale+live%22+%22meme+coin%22&src=typed_query&f=live",chain:"Any",tag:"🐦 X",tip:"'Presale live' posters need eyes NOW. Most urgent leads. Close same day if you move fast."},
  {name:"Telegram Gems",url:"https://t.me/GemCallsOfficial",chain:"Multi-chain",tag:"💎 Gems",tip:"Find the project before the call hits. Pitch the founder first."},
];

const PROMPTS=[
  {cat:"🤝 RELATIONSHIP-FIRST APPROACH",items:[
    {label:"Step 1 — Space Engagement",sub:"Join their X Spaces for 3–5 days",text:"Find their X Spaces or Twitter Lives. Join every one for 3-5 days straight. Don't speak. Just be present. Your name shows up in the listeners list consistently. Founders notice who keeps showing up. Consistency signals you're serious before you say a word."},
    {label:"Step 2 — Content Reply",sub:"Reply with a real thought, not a compliment",text:"Loved your point about community retention in today's space. Most projects underestimate onboarding — they focus so hard on acquisition they forget to keep the holders they already have."},
    {label:"Step 3 — The Observation Reply",sub:"Show you've been paying attention",text:"The way you're positioning [project] right now is interesting — most projects at this stage go loud too early and burn the audience before the product is ready. The patience you're showing is actually a signal of a serious team."},
    {label:"Step 4 — The Natural DM",sub:"After 5–7 days of warm engagement",text:"Been following your build for a bit — your take on [specific thing they posted] was sharp. Quick question: who's handling your [KOL/collab/community] strategy right now? Think there's a specific angle you're missing based on where you are in the roadmap."},
    {label:"Unhinged Warm Opener",sub:"Bold version after engagement",text:"Your spaces are actually good which is rare. The product is real. The marketing is the problem and it's fixable. DM me if you want to know what I'd do differently."},
    {label:"The Transition Close",sub:"Moving from conversation to deal",text:"Genuinely think there's something worth exploring here. I've been watching your space and the gap between what you're building and how it's being positioned is wider than it needs to be. 15 minutes — I'll show you exactly what I'd change. No pitch, just the diagnosis."},
  ]},
  {cat:"🔍 GROK SEARCH PROMPTS",items:[
    {label:"Meme Coin Daily Scout",sub:"Run every morning",text:"Search X posted in the last 48 hours for meme coin projects: token live or launching within 14 days, under 2000 followers, no active KOL campaign, has a website in bio. Include Solana, Base, BSC, ETH. For each: X handle, website URL, chain, follower count, and the post that shows they're actively pushing. Give me at least 20 results. Prioritize presale or whitelist open."},
    {label:"Utility Project Scout",sub:"Higher-value closes",text:"Find Web3 utility projects on X posted in the last 14 days: live product or testnet running, under 15K followers, no active KOL campaign, low engagement relative to follower count. Focus on DeFi tools, AI agents, staking protocols, DEX aggregators, gaming infrastructure. List handle, utility, stage, and the post showing they're building but not being seen."},
    {label:"Early Stage Alert",sub:"Pre-launch window",text:"Search X last 7 days for crypto projects: less than 500 followers, announcing a product build or roadmap, no token launched yet, active founder posting daily. Pre-launch projects needing community building now. List handle, what they're building, how active the founder looks."},
    {label:"KOL Opportunity Scout",sub:"Who needs KOL management",text:"Search X last 5 days for crypto projects: token launched, under 5000 holders, posting about wanting more exposure or KOLs or marketing. Any chain. Founder active and responsive. List handle, chain, follower count, and the specific post showing they want marketing help."},
    {label:"Spaces Scout",sub:"Find founders hosting spaces",text:"Search X in the last 7 days for crypto or Web3 founders who hosted a Space with under 10000 followers, actively posting about their project build, and have a token or product launching within 60 days. These are founders in build mode who are accessible and talking. List their handle, what they're building, when their last Space was."},

  {cat:"💬 COLD DM TEMPLATES",items:[

        {label:"Strategist",icon:"📖",id:"strat",fn:()=>sT("strat")},
        {label:isPro?"Pro ✓":"Pro",icon:isPro?"💎":"🔒",id:"pro",fn:()=>sT("pro")},
      ].map(({label,icon,id,fn})=>e("button",{key:id,className:`nb${tab===id?" on":""}`,onClick:fn},e("span",{className:"ni"},icon),label))
    )
  );
}

ReactDOM.render(React.createElement(App),document.getElementById("app"));
</script>
